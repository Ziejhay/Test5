<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup Codes Vault</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
body {
font-family: 'Plus Jakarta Sans', sans-serif;
}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

<header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-3">
<div class="p-2 bg-indigo-600 rounded-lg text-white">
<i data-lucide="key-round" class="w-6 h-6"></i>
</div>
<div>
<h1 class="text-xl font-bold tracking-tight">Backup Codes Vault</h1>
<p class="text-xs text-slate-400">Secure recovery codes for your accounts</p>
</div>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
<div class="relative flex-1 max-w-md">
<i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
<input
type="text"
id="searchInput"
placeholder="Search platform or codes..."
class="w-full pl-10 pr-4 py-2.5 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm text-slate-200 placeholder-slate-500"
>
</div>
</div>

<div id="codesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

<div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-slate-500">
<i data-lucide="folder-open" class="w-12 h-12 mb-3 stroke-[1.5]"></i>
<p class="text-sm">No backup codes found matching your search.</p>
</div>
</main>

<script>
const backupCodesData = [
{ platform: "Google (UST)", codes: ["4402 5072", "4648 7140", "7436 7710", "6993 4290"] },
{ platform: "Google (MAIN)",codes: ["4776 2336", "9499 3406", "0271 0526", "5485 4685"] },
{ platform: "Facebook", codes: ["fb-code-01", "fb-code-02", "fb-code-03", "fb-code-04"] },
{ platform: "Instagram", codes: ["4258 6238", "4546 1670", "4874 1738", "5166 3678"] }
];

let searchQuery = '';

document.addEventListener('DOMContentLoaded', () => {
renderCodes();
lucide.createIcons();

document.getElementById('searchInput').addEventListener('input', (e) => {
searchQuery = e.target.value.toLowerCase();
renderCodes();
});
});

function copyText(text, btnElement) {
navigator.clipboard.writeText(text).then(() => {
const originalHTML = btnElement.innerHTML;
btnElement.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>`;
lucide.createIcons();
setTimeout(() => {
btnElement.innerHTML = originalHTML;
lucide.createIcons();
}, 1500);
});
}

function toggleCodeVisibility(index) {
const container = document.getElementById(`codes-container-${index}`);
const eyeBtn = document.getElementById(`eye-btn-${index}`);
const isHidden = container.classList.contains('blur-sm');

if (isHidden) {
container.classList.remove('blur-sm', 'select-none');
eyeBtn.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i>`;
} else {
container.classList.add('blur-sm', 'select-none');
eyeBtn.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i>`;
}
lucide.createIcons();
}

function renderCodes() {
const grid = document.getElementById('codesGrid');
const emptyState = document.getElementById('emptyState');
grid.innerHTML = '';

const filtered = backupCodesData.filter(item => {
if (searchQuery) {
const matchPlatform = item.platform.toLowerCase().includes(searchQuery);
const matchCodes = item.codes.some(c => c.toLowerCase().includes(searchQuery));
return matchPlatform || matchCodes;
}
return true;
});

filtered.sort((a, b) => a.platform.localeCompare(b.platform));

if (filtered.length === 0) {
emptyState.classList.remove('hidden');
emptyState.classList.add('flex');
return;
} else {
emptyState.classList.add('hidden');
emptyState.classList.remove('flex');
}

filtered.forEach((item, index) => {
const allCodesString = item.codes.join('\n');
const card = document.createElement('div');
card.className = "bg-slate-800/40 border border-slate-700/50 hover:border-indigo-500/50 rounded-2xl p-5 transition-all duration-300 flex flex-col justify-between hover:shadow-xl hover:shadow-indigo-500/5";

let codesListHTML = '';
item.codes.forEach(code => {
codesListHTML += `
<div class="flex items-center justify-between bg-slate-900/50 p-2 rounded-lg border border-slate-800 text-xs font-mono">
<span class="text-slate-200 select-all">${code}</span>
<button onclick="copyText('${code}', this)" class="text-slate-400 hover:text-white transition p-0.5" title="Copy Code">
<i data-lucide="copy" class="w-3.5 h-3.5"></i>
</button>
</div>
`;
});

card.innerHTML = `
<div>
<div class="flex items-center justify-between mb-4">
<span class="font-bold text-base tracking-wide text-white">${item.platform}</span>
<div class="flex items-center gap-1">
<button onclick="toggleCodeVisibility(${index})" id="eye-btn-${index}" class="text-slate-400 hover:text-white transition p-1 bg-slate-900/60 rounded-lg border border-slate-800" title="Toggle Visibility">
<i data-lucide="eye" class="w-4 h-4"></i>
</button>
<button onclick="copyText('${allCodesString}', this)" class="text-slate-400 hover:text-white transition p-1 bg-slate-900/60 rounded-lg border border-slate-800" title="Copy All Codes">
<i data-lucide="copy" class="w-4 h-4"></i>
</button>
</div>
</div>

<div id="codes-container-${index}" class="space-y-2 mb-4 blur-sm select-none transition-all duration-200">
${codesListHTML}
</div>
</div>

<div class="pt-3 border-t border-slate-700/40 mt-auto flex items-center justify-between text-[11px] text-slate-500">
<span>${item.codes.length} recovery codes saved</span>
</div>
`;
grid.appendChild(card);
});

lucide.createIcons();
}
</script>
</body>
</html>
